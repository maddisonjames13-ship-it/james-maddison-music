<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>James Maddison Music | Composer, Musical Director & Arranger</title>
  <meta name="description" content="James Maddison Music — UK composer, musical director and arranger creating original music for film, theatre and voices.">
  <meta name="theme-color" content="#111310">

  <meta property="og:title" content="James Maddison Music">
  <meta property="og:description" content="Composer · Musical Director · Arranger — original music for film, theatre and voices.">
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg: #111310;
      --bg-soft: #171a16;
      --text: #f2efe7;
      --muted: #cbc7bd;
      --accent: #9ab6ab;
      --line: rgba(242, 239, 231, 0.15);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(154, 182, 171, 0.09), transparent 34rem),
        radial-gradient(circle at 85% 80%, rgba(255,255,255,0.035), transparent 28rem),
        linear-gradient(145deg, var(--bg-soft), var(--bg));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .frame {
      width: min(1180px, calc(100% - 40px));
      min-height: min(760px, calc(100vh - 40px));
      border: 1px solid var(--line);
      position: relative;
      padding: clamp(28px, 5vw, 70px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(2px);
    }

    .top-space {
      min-height: 34px;
    }

    main {
      max-width: 900px;
      padding: 7.5vh 0 8.5vh;
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 0.78rem;
      line-height: 1;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    h1 {
      margin: 0;
      max-width: 10ch;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(3.7rem, 9vw, 8rem);
      line-height: 0.88;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .roles {
      margin: 30px 0 0;
      font-size: clamp(1rem, 1.8vw, 1.35rem);
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .intro {
      margin: 29px 0 0;
      max-width: 620px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 2.2vw, 2rem);
      line-height: 1.45;
      color: var(--text);
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .coming {
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--accent);
    }

    .contact {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(242, 239, 231, 0.35);
      padding-bottom: 2px;
      transition: border-color 160ms ease, color 160ms ease;
    }

    .contact:hover,
    .contact:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
    }

    .domain {
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      body {
        display: block;
        padding: 16px;
      }

      .frame {
        width: 100%;
        min-height: calc(100vh - 32px);
        padding: 28px 24px;
      }

      .top-space {
        min-height: 8px;
      }

      main {
        padding: 11vh 0 9vh;
      }

      h1 {
        font-size: clamp(3.2rem, 17vw, 5.3rem);
      }

      footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .frame {
        animation: fadeIn 900ms ease-out both;
      }

      main > * {
        animation: rise 850ms ease-out both;
      }

      main > *:nth-child(2) { animation-delay: 80ms; }
      main > *:nth-child(3) { animation-delay: 160ms; }
      main > *:nth-child(4) { animation-delay: 240ms; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="top-space" aria-hidden="true"></div>

    <main>
      <p class="eyebrow">James Maddison Music</p>
      <h1>James Maddison</h1>
      <p class="roles">Composer · Musical Director · Arranger</p>
      <p class="intro">Original music for film, theatre and voices.</p>
    </main>

    <footer>
      <div class="footer-left">
        <div class="coming">Full website coming soon</div>
        <a class="contact" href="mailto:YOUR_EMAIL_HERE">Contact</a>
      </div>
      <div class="domain">jamesmaddisonmusic.co.uk</div>
    </footer>
  </div>
</body>
</html>
